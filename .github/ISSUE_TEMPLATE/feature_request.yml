name: Feature request
description: Suggest something Named Links should be able to do
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Named Links aims to stay a small plugin that does one thing: turn URLs
        into links titled with their page's name. Suggestions that fit that
        shape are the easiest to land.

  - type: checkboxes
    id: checks
    attributes:
      label: Before requesting
      options:
        - label: I searched the existing issues and didn't find this one.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: |
        Describe the problem rather than the solution first. It often turns out
        there's already a way to do it, or a simpler one nobody had thought of.
      placeholder: I paste links to a site whose titles all end in " | Some Site", and I …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: The change as you picture it, such as a setting, a command, or a different title.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: |
        Including workarounds you're using today, or other plugins that do part of this.

  - type: checkboxes
    id: contributing
    attributes:
      label: Contributing
      options:
        - label: I'd be willing to open a pull request for this.
