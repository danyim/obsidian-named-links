name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

# gh release create needs write access to contents, spelled out rather than
# left to the repository default, which may be read-only. attest-build-provenance
# needs id-token (to mint the signing identity) and attestations (to publish it).
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - run: npm ci

      # Obsidian installs a version from the release whose tag matches the
      # manifest's version exactly, so a tag that doesn't would publish a
      # release no one can install.
      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(jq -r .version manifest.json)"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag doesn't match manifest.json version $version"
            exit 1
          fi

      # The fast checks only. The e2e suite needs a display and downloads
      # Obsidian, and test.yaml already runs it on every push to main, which
      # is where release tags are cut from.
      - name: Lint, type-check and unit tests
        run: |
          npm run lint
          npm run check-types
          npm run test:unit

      - name: Build plugin
        run: npm run build

      # Obsidian's community catalog installs from the three loose files, but
      # a manual install needs them inside a folder named after the plugin id
      # under .obsidian/plugins/. Ship a zip laid out that way so it can be
      # extracted there as-is.
      - name: Package zip for manual install
        id: zip
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          id="$(jq -r .id manifest.json)"
          zip="$id-$tag.zip"

          mkdir "$id"
          cp main.js manifest.json styles.css "$id/"
          zip -r "$zip" "$id"

          echo "path=$zip" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            styles.css
            ${{ steps.zip.outputs.path }}

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            --draft \
            main.js manifest.json styles.css "${{ steps.zip.outputs.path }}"
